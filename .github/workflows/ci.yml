name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Map changed paths to per-package filters (#574). PRs run only the jobs for
  # packages they change, plus packages that depend on them. Any push to main
  # forces full=true (all package jobs run).
  detect:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full == 'true' || github.event_name == 'push' }}
      hybrid_expo: ${{ steps.filter.outputs.hybrid_expo }}
      shared: ${{ steps.filter.outputs.shared }}
      tx_parser: ${{ steps.filter.outputs.tx_parser }}
      contracts: ${{ steps.filter.outputs.contracts }}
      analyst: ${{ steps.filter.outputs.analyst }}
      entity_manager: ${{ steps.filter.outputs.entity_manager }}
      latest_updates: ${{ steps.filter.outputs.latest_updates }}
      scout: ${{ steps.filter.outputs.scout }}
      api: ${{ steps.filter.outputs.api }}
      collectors: ${{ steps.filter.outputs.collectors }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            full:
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'ecosystem.config.cjs'
              - 'scripts/check-ecosystem.ts'
              - '.github/workflows/**'
              - 'packages/atlas-schema/**'
              - 'supabase/migrations/**'
            hybrid_expo:
              - 'apps/hybrid-expo/**'
            shared:
              - 'packages/shared/**'
            tx_parser:
              - 'packages/tx-parser/**'
            contracts:
              - 'packages/contracts/**'
            analyst:
              - 'packages/analyst/**'
            entity_manager:
              - 'packages/entity-manager/**'
            latest_updates:
              - 'packages/latest-updates/**'
            scout:
              - 'packages/scout-news/**'
            api:
              - 'packages/api/**'
            collectors:
              - 'packages/collectors/**'

  # Per-package jobs: a failure in one package cannot hide the others. Each runs
  # only when the PR touches it or its dependencies (see docs/CI.md). Skipped is OK.
  hybrid-expo:
    needs: detect
    if: needs.detect.outputs.full == 'true' || needs.detect.outputs.hybrid_expo == 'true' || needs.detect.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-ecosystem.ts
      - run: pnpm --filter hybrid-expo lint
      - run: pnpm --filter hybrid-expo test

  shared:
    needs: detect
    if: needs.detect.outputs.full == 'true' || needs.detect.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-ecosystem.ts
      - run: pnpm --filter @myboon/shared test
      - run: pnpm --filter @myboon/shared typecheck

  tx-parser:
    needs: detect
    if: needs.detect.outputs.full == 'true' || needs.detect.outputs.tx_parser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-ecosystem.ts
      - run: pnpm --filter @myboon/tx-parser test

  contracts:
    needs: detect
    if: needs.detect.outputs.full == 'true' || needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-ecosystem.ts
      - run: pnpm --filter @myboon/contracts test
      - run: pnpm --filter @myboon/contracts typecheck

  analyst:
    needs: detect
    if: needs.detect.outputs.full == 'true' || needs.detect.outputs.analyst == 'true' || needs.detect.outputs.shared == 'true' || needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    services:
      # Local Postgres for the atlas-driven suites (analyst throwaway DBs).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-ecosystem.ts
      - run: pnpm --filter @myboon/analyst test
        env:
          ANALYST_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: pnpm --filter @myboon/analyst typecheck

  # #621 the entity manager package had no CI job. Unit tests, plus the em_claim_scoped suite on a local Postgres.
  entity-manager:
    needs: detect
    if: needs.detect.outputs.full == 'true' || needs.detect.outputs.entity_manager == 'true' || needs.detect.outputs.shared == 'true' || needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myboon/entity-manager test
        env:
          EM_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: pnpm --filter @myboon/entity-manager typecheck

  # #631 latest updates: unit tests, plus the store and runner suite on a local Postgres with every atlas migration
  # applied (the job connects as latest_update_worker), then the eval script on the frozen set (it says so and exits 0
  # while labels.csv is blank).
  latest-updates:
    needs: detect
    if: needs.detect.outputs.full == 'true' || needs.detect.outputs.latest_updates == 'true' || needs.detect.outputs.shared == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myboon/latest-updates test
        env:
          LU_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: pnpm --filter @myboon/latest-updates typecheck
      - run: pnpm --filter @myboon/latest-updates eval

  scout-news:
    needs: detect
    if: needs.detect.outputs.full == 'true' || needs.detect.outputs.scout == 'true' || needs.detect.outputs.shared == 'true' || needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    services:
      # scout.db.test.ts needs a disposable DB with the atlas migrations applied. Same applier as the
      # analyst throwaway DBs (@myboon/atlas-schema), incl. its local tool_log stand-in (no pg_cron).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-ecosystem.ts
      - name: Prepare scout test database
        run: pnpm exec tsx packages/atlas-schema/scripts/prepare-db.ts postgres://postgres:postgres@127.0.0.1:5432/postgres scout_test
      - run: pnpm --filter @myboon/scout-news test
        env:
          SCOUT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/scout_test
      - run: pnpm --filter @myboon/scout-news typecheck

  api:
    needs: detect
    if: needs.detect.outputs.full == 'true' || needs.detect.outputs.api == 'true' || needs.detect.outputs.shared == 'true' || needs.detect.outputs.collectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/check-ecosystem.ts
      - run: pnpm --filter @myboon/api test:internal
      - run: pnpm --filter @myboon/api test:phoenix
      - run: pnpm --filter @myboon/api test:latest-updates
      - run: pnpm --filter @myboon/api test:feed
      - run: pnpm --filter @myboon/api typecheck

  # Single stable PR check: green when every job that actually ran succeeded.
  # Skipped jobs (paths not touched / filtered out) do not block it. No checkout
  # needed; it only inspects the needs results.
  ci-ok:
    needs: [detect, secrets, migrations-lint, hybrid-expo, shared, tx-parser, contracts, analyst, entity-manager, latest-updates, scout-news, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job that ran did not succeed
        run: |
          bad=0
          for pair in \
            detect:${{ needs.detect.result }} \
            secrets:${{ needs.secrets.result }} \
            migrations-lint:${{ needs.migrations-lint.result }} \
            hybrid-expo:${{ needs.hybrid-expo.result }} \
            shared:${{ needs.shared.result }} \
            tx-parser:${{ needs.tx-parser.result }} \
            contracts:${{ needs.contracts.result }} \
            analyst:${{ needs.analyst.result }} \
            entity-manager:${{ needs.entity-manager.result }} \
            latest-updates:${{ needs.latest-updates.result }} \
            scout-news:${{ needs.scout-news.result }} \
            api:${{ needs.api.result }}; do
            job="${pair%%:*}"
            result="${pair##*:}"
            echo "$job: $result"
            case "$result" in
              failure|cancelled) bad=1 ;;
            esac
          done
          exit $bad

  migrations-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # squawk on the V4 atlas migrations (#441). Older migrations predate the linter.
      - run: npx -y squawk-cli@2.70.0 --pg-version 17 supabase/migrations/*atlas*.sql supabase/rollbacks/*atlas*.down.sql
