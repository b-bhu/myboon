name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No package defines a typecheck script yet; the root test script is a placeholder, so it is not run.
      - run: pnpm --filter hybrid-expo lint
      - run: pnpm --filter hybrid-expo test
      - run: pnpm --filter @myboon/shared test
      - run: pnpm --filter @myboon/tx-parser test
      - run: pnpm --filter @myboon/api test:internal
      - run: pnpm --filter @myboon/api typecheck
