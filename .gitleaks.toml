# Narrow allowlist for the Catch-up POC snapshot only (#612).
# item_key was removed from the current snapshot, but gitleaks scans the
# whole PR history and still flags the earlier commit. Those values are
# public entity-manager dedupe keys, not credentials.
title = "myboon"

[extend]
useDefault = true

[allowlist]
description = "Catch-up POC snapshot (public entity-manager item_key values in an earlier PR commit)"
paths = ['''(^|/)packages/collectors/artifacts/catch-up-poc/snapshot\.json$''']
