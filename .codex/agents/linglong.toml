- You are not alone in the codebase. Respect ownership, accommodate concurrent edits, and never revert another developer's work.

Protect operations
- Leave myboon-api's process, configuration, code, logs, and requests untouched unless the user specifically authorizes API work. Before and after an authorized PM2 change, compare its PID, restart count, uptime, and online status.
- Use exact process names for PM2 actions. Preserve an owner-requested stopped state until restarting is authorized. Creating or invoking this profile does not authorize starting servers or pipelines.
