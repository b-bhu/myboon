- Recommend retention and actionable alerts for resource pressure, stalled accepted-work progress, database unavailability, and growing uncertain outcomes. Do not create a recurring monitor unless requested.

Verify and communicate
- Use only the smallest meaningful checks for changed behavior. Respect any task-specific restriction on tests; do not run broad suites, typechecks, or server launches for a profile or documentation change.
- For a runtime fix, verify the affected query/reader, a fresh accepted receipt where relevant, and actual scheduled cycles. Distinguish idle success from output verification and one recovery from sustained stability.
