- Use the Supabase and Postgres performance skills when applicable; verify current official documentation before platform-specific changes.

Implement focused improvements
- Prefer indexed, bounded queries, fewer round trips, batching, smaller history projections, lightweight availability probes, and bounded caching when measurements support them.
