<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>MyBoon · Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#031F2C;--card:#063343;--surf:#073B4C;--edge:#185A70;--bone:#F5FAFC;--dim:#9CB8C2;--faint:#6B95A1;
  --vir:#06D6A0;--gold:#FFD166;--verm:#EF476F;
  --font:"Inter",system-ui,sans-serif;--display:"Space Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#020f16;color:var(--bone);font:15px/1.4 var(--font)}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 72px;gap:18px}
.phone{
  width:min(390px,100%);height:min(844px,calc(100vh - 96px));
  background:var(--bg);border-radius:36px;border:1px solid #124255;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  box-shadow:0 24px 64px #0006;
}
.status{height:48px;flex:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:500 12px var(--font);color:var(--dim)}
.view{flex:1;min-height:0;position:relative;overflow:hidden}
.wallet{position:absolute;inset:0;padding:8px 20px 24px;overflow:auto}
.wallet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.wallet .hd h1{font:600 22px/1.2 var(--display)}
.wallet .link{color:var(--dim);font:500 14px var(--font);min-height:44px;padding:0 4px}
.wallet .bal{font:600 40px/1.05 var(--display);letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.wallet .hint{margin-top:8px;color:var(--dim);font-size:13px;max-width:100%;word-break:break-all;overflow-wrap:anywhere;line-height:1.4}
.wallet .tabs{display:flex;gap:18px;margin:28px 0 12px;border-bottom:1px solid var(--edge)}
.wallet .tabs span{padding:10px 0 12px;color:var(--faint);font:500 14px var(--font)}
.wallet .tabs .on{color:var(--bone);box-shadow:inset 0 -2px 0 var(--bone)}
.asset{display:flex;align-items:center;gap:12px;min-height:64px}
.asset .ic{width:40px;height:40px;border-radius:20px;background:var(--card);display:grid;place-items:center;font:600 12px var(--font);color:var(--dim)}
.asset .nm{flex:1}.asset .nm b{display:block;font:500 15px var(--font)}.asset .nm span{color:var(--faint);font-size:13px}
.asset .amt{font:500 15px var(--font);font-variant-numeric:tabular-nums;color:var(--faint)}
.fab{
  position:absolute;left:20px;right:20px;bottom:28px;height:52px;border-radius:14px;
  background:var(--bone);color:var(--bg);font:600 16px var(--display);
}
.scrim{position:absolute;inset:0;background:#031F2Cb8;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92%;
  background:var(--surf);border-radius:20px 20px 0 0;border-top:1px solid var(--edge);
  display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;
  padding-bottom:max(20px,env(safe-area-inset-bottom));
}
.sheet.on{transform:none}
.handle{width:36px;height:4px;border-radius:2px;background:#1f5a6e;margin:10px auto 0;flex:none}
.sheet-hd{display:flex;align-items:flex-start;gap:8px;padding:12px 16px 4px;flex:none}
.sheet-hd .back{width:44px;height:44px;margin:-4px 0 0 -6px;border-radius:12px;color:var(--dim);font-size:22px;line-height:1;display:none}
.sheet-hd .back.show{display:grid;place-items:center}
.sheet-hd .t{flex:1;min-width:0;padding-top:6px}
.sheet-hd h2{font:600 20px/1.25 var(--display)}
.sheet-hd p{margin-top:4px;color:var(--dim);font-size:14px;max-width:34ch}
.sheet-hd .x{width:44px;height:44px;margin:-6px -8px 0 0;border-radius:12px;color:var(--dim);font-size:22px;line-height:1}
.sheet-bd{padding:10px 16px 8px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}

.export-options{display:flex;flex-direction:column;gap:12px;padding-top:2px}
.sheet[data-state="export"] .sheet-bd{padding-top:8px;padding-bottom:0}
.sheet[data-state="export"] .homebar{height:8px}
.export-actions{display:flex;flex-direction:column;gap:8px}
.export-actions .btn-primary{min-height:52px;padding:14px}
.export-actions .btn-secondary{min-height:44px;padding:10px}
/* Content-sized at ordinary text sizes; existing overflow:auto remains an accessibility fallback. */
.btn-primary{
  min-height:56px;width:100%;padding:16px 18px;border-radius:14px;
  background:var(--bone);color:var(--bg);font:600 16px var(--display);text-align:center;
}
.btn-primary:active{opacity:.9}
.btn-secondary{
  min-height:56px;width:100%;padding:16px 18px;border-radius:14px;
  background:var(--card);color:var(--bone);font:600 16px var(--display);text-align:center;
  border:1px solid var(--edge);
}
.btn-secondary:active{background:#0a3d4f}

.connect-form{padding-top:4px}
.connect-form label{display:block;margin-bottom:8px;color:var(--dim);font:500 13px var(--font)}
.email-field{display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--edge)}
.email-field svg,.external-entry svg{width:20px;height:20px;flex:none;color:var(--dim)}
.email-field input{width:100%;min-width:0;min-height:52px;font-size:16px;caret-color:var(--vir)}
.email-field input::placeholder{color:var(--dim)}
.email-field:focus-within{border-color:var(--vir)}
.email-field:has([aria-invalid="true"]){border-color:var(--verm)}
.email-error{color:var(--bone);font-size:13px;margin-top:8px}
.connect-form .cta{margin-top:12px}
.external-entry{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;margin-top:20px;padding:12px;border-radius:14px;border:1px solid var(--edge);color:var(--bone);font:500 15px var(--font)}
.external-entry:hover,.external-entry:active{background:var(--card)}

.cta{
  min-height:52px;width:100%;border-radius:14px;background:var(--bone);color:var(--bg);
  font:600 16px var(--display);margin-top:4px;
}
.cta:disabled{opacity:.35}
.cta.ghost{background:var(--card);color:var(--bone);border:1px solid var(--edge)}
.cta.danger{background:transparent;color:var(--verm);border:1px solid #7a2a3c}
.otp{margin:8px 0 4px}
.otp input{display:block;width:100%;height:56px;padding:0 12px;border-radius:12px;background:var(--card);text-align:center;font:600 24px var(--display);letter-spacing:.35em;caret-color:var(--vir)}
.otp input::placeholder{color:var(--faint)}
.otp input[aria-invalid="true"]{outline:1px solid var(--verm)}
.otp-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.otp-paste,.otp-resend{min-height:44px;padding:0 8px;color:var(--vir);font:500 14px var(--font)}
.otp-resend:disabled{color:var(--dim);cursor:default}
.otp-feedback{min-height:20px;color:var(--dim);font-size:13px;margin-bottom:4px}
.otp-error{color:var(--bone);font-size:13px;margin-bottom:8px}
.export-steps{padding-left:24px;margin:0;color:var(--bone);font-size:16px;line-height:1.45}
.export-steps li{padding-left:2px;margin-bottom:12px}
.export-steps li:last-child{margin-bottom:0}
.export-steps li::marker{color:var(--dim);font-weight:500}
.key-warning{padding:8px 10px;border-radius:12px;background:var(--card);color:var(--gold);font-size:14px;line-height:1.5}
.sheet-hd p{overflow-wrap:anywhere}
@supports(height:100dvh){.phone{height:min(844px,calc(100dvh - 96px))}}
html.mb-embed,html.mb-embed body{height:auto;min-height:0;background:#020f16}
html.mb-embed .stage{min-height:0;height:auto;justify-content:flex-start;padding:8px 0 16px}
html.mb-embed .phone{height:844px !important;width:min(390px,100%)}
.wait{padding:28px 8px 20px;text-align:center}
.wait .spin{
  width:36px;height:36px;margin:0 auto 16px;border-radius:50%;
  border:3px solid var(--edge);border-top-color:var(--vir);animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.wait h3{font:600 18px var(--display);margin-bottom:6px}
.wait p{color:var(--dim);font-size:14px}

.fail{padding:12px 4px 8px;text-align:center}
.fail .icon{
  width:48px;height:48px;margin:4px auto 14px;border-radius:24px;background:#3a1a24;
  color:var(--verm);display:grid;place-items:center;font-size:22px;
}
.fail h3{font:600 18px var(--display);margin-bottom:6px}
.fail p{color:var(--dim);font-size:14px;margin-bottom:18px}
.fail .logout{margin-top:14px;color:var(--faint);font:500 14px var(--font);min-height:44px;text-decoration:underline;text-underline-offset:3px}

.ok{padding:8px 4px}
.ok .ident{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ok .ident .mark{width:44px;height:44px;border-radius:12px;background:var(--card);display:grid;place-items:center;flex:none;font:600 15px var(--font)}
.ok .ident .mark svg{width:22px;height:22px;display:block}
.ok .ident .mark.em{background:#0a4a5c;color:var(--vir)}
.ok .ident .who b{display:block;font:600 17px/1.25 var(--display)}
.ok .ident .who span{display:block;color:var(--faint);font-size:13px;margin-top:2px}
.ok .addr{
  padding:0 2px;
  color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;
}
.ok .addr .str{
  display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.4;white-space:nowrap;color:var(--dim);
}
.ok .addr .str{scrollbar-width:thin;scrollbar-color:var(--edge) var(--card)}
.ok .addr .str::-webkit-scrollbar{height:4px}
.ok .addr .str::-webkit-scrollbar-track{background:var(--card)}
.ok .addr .str::-webkit-scrollbar-thumb{background:var(--edge);border-radius:2px}
.ok .net{color:var(--faint);font-size:13px;margin:2px 0 18px;padding:0 2px}
.ok .chain{
  margin:0 0 14px;padding:12px 12px 10px;border-radius:14px;background:var(--card);
}
.ok .chain .labrow{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:6px;padding:0 2px;min-height:28px;
}
.ok .chain .lab{color:var(--faint);font:500 12px var(--font);letter-spacing:.02em}
.ok .chain .labrow button{color:var(--vir);font:500 13px var(--font);min-height:28px;padding:0 2px;flex:none}
.ok .chain .addr{padding:0}
.ok .actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}

.homebar{height:18px;flex:none}

#dock{
  display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;max-width:390px;
  opacity:.55;font-size:11px;line-height:1;
}
#dock button{
  min-height:28px;padding:0 2px;color:#7a9aa6;font:500 11px var(--font);letter-spacing:.01em;
}
#dock button:hover,#dock button.on{color:#c5dce4}
button:focus-visible,input:focus-visible{outline:2px solid var(--vir);outline-offset:3px}
::selection{background:var(--vir);color:var(--bg)}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}.wait .spin{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="status">9:41</div>
    <div class="view">
      <div class="wallet">
        <div class="hd">
          <h1>Wallet</h1>
          <button class="link" type="button" id="manageBtn">Manage</button>
        </div>
        <div class="bal" id="bal">$0.00</div>
        <p class="hint" id="hint">Connect a wallet to trade and hold positions.</p>
        <div class="tabs"><span class="on">Assets</span><span>Activity</span></div>
        <div class="asset"><div class="ic">SOL</div><div class="nm"><b>Solana</b><span>SOL</span></div><div class="amt" id="amtSol">—</div></div>
        <div class="asset"><div class="ic">USDC</div><div class="nm"><b>USD Coin</b><span>USDC</span></div><div class="amt" id="amtUsdc">—</div></div>
      </div>
      <button class="fab" type="button" id="openBtn">Connect wallet</button>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="title">
        <div class="handle"></div>
        <div class="sheet-hd">
          <button class="back" type="button" id="backBtn" aria-label="Back">‹</button>
          <div class="t">
            <h2 id="title">Connect</h2>
            <p id="sub"></p>
          </div>
          <button class="x" type="button" id="closeBtn" aria-label="Close">×</button>
        </div>
        <div class="sheet-bd" id="body"></div>
        <div class="homebar"></div>
      </div>
    </div>
  </div>
  <div style="color:var(--dim);font-size:11px">Interactive demo · Sample wallets and balances</div>
  <div id="dock" aria-label="Demo states"></div>
</div>
<script>
if(location.search.indexOf('embed')!==-1)document.documentElement.classList.add('mb-embed');
const STATES = [
  ['home','Home'],
  ['connect','Connect'],
  ['otp','OTP'],
  ['wait_setup','Setting up'],
  ['wait_ext','Connecting'],
  ['fail_login','Fail login'],
  ['fail_setup','Fail setup'],
  ['ok_privy','Connected · Privy'],
  ['ok_ext','Connected · Ext'],
  ['export','Export'],
  ['export_wait','Privy…'],
  ['export_done','Export demo'],
  ['confirm','Disconnect'],
];

const copy = {
  connect: { title:'Connect to MyBoon', sub:'' },
  otp:     { title:'Enter code', sub:'Sent to you@example.com' },
  wait_setup: { title:'Setting up wallet', sub:'' },
  wait_ext:{ title:'Waiting for wallet', sub:'' },
  fail_login: { title:'Sign-in failed', sub:'' },
  fail_setup: { title:'Wallet setup failed', sub:'' },
  ok_privy: { title:'Wallets', sub:'' },
  ok_ext:   { title:'Wallet', sub:'' },
  export:   { title:'Export / recovery', sub:'' },
  export_wait: { title:'Privy demo', sub:'' },
  export_done: { title:'Demo complete', sub:'' },
  confirm:  { title:'Disconnect?', sub:'You can reconnect anytime.' },
};

const body = document.getElementById('body');
const title = document.getElementById('title');
const sub = document.getElementById('sub');
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
const backBtn = document.getElementById('backBtn');
const openBtn = document.getElementById('openBtn');
const manageBtn = document.getElementById('manageBtn');
const bal = document.getElementById('bal');
const hint = document.getElementById('hint');

let state = 'home';
let stack = [];
/** null | 'privy' | 'ext' */
let linked = null;
let setupFails = 0;
let confirmFrom = 'ok_privy';
let emailIdentity = 'you@example.com';
let emailDraft = '';
// Illustrative timings only; production must use the auth service's retry deadline.
const DEMO_RESEND_SECONDS = 30;
const DEMO_SEND_MS = 700;
let otpEmail = '';
let otpCode = '';
let otpResendAt = 0;
let otpSendingUntil = 0;
let otpMessage = '';
let otpIsResend = false;
let otpTimer = null;

function stopOtpTimer(){
  if (otpTimer !== null) clearInterval(otpTimer);
  otpTimer = null;
}

function beginDemoSend(resend){
  otpIsResend = resend;
  otpSendingUntil = Date.now() + DEMO_SEND_MS;
  otpResendAt = Date.now() + DEMO_RESEND_SECONDS * 1000;
  otpMessage = resend ? 'Resending code… (demo)' : 'Sending code… (demo)';
}

function prepareOtp(email){
  if (otpEmail === email) return;
  otpEmail = email;
  otpCode = '';
  beginDemoSend(false);
}

function syncOtp(){
  if (state !== 'otp') return;
  const now = Date.now();
  if (otpSendingUntil && now >= otpSendingUntil){
    otpSendingUntil = 0;
    otpMessage = otpIsResend ? 'Code resent (demo).' : 'Code sent (demo).';
  }
  const remaining = Math.max(0, Math.ceil((otpResendAt - now) / 1000));
  const resend = document.getElementById('otpResend');
  resend.disabled = Boolean(otpSendingUntil) || remaining > 0;
  resend.textContent = remaining > 0 ? 'Resend code · ' + remaining + 's' : 'Resend code';
  const status = document.getElementById('otpStatus');
  if (status.textContent !== otpMessage) status.textContent = otpMessage;
  if (!otpSendingUntil && remaining === 0) stopOtpTimer();
}

function watchOtp(){
  stopOtpTimer();
  syncOtp();
  if (otpSendingUntil || Date.now() < otpResendAt) otpTimer = setInterval(syncOtp, 250);
}


const ADDR_PRIVY_SOL = '7nYxK9QmR2pLsT4vW8cJ1dF6hG3aB0eZpX9mQ2rL4kNw';
const ADDR_PRIVY_EVM = '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEbA';
const ADDR_EXT       = 'DRpbFRkq9x2mHn4sT8vW1cJ6dF3hG0aBxY4nP7qK2mH';

const ICON_EMAIL = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h12a2.5 2.5 0 0 1 2.5 2.5v9A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-9Z" stroke="currentColor" stroke-width="1.75"/><path d="m4.5 8 6.7 5.1a1.5 1.5 0 0 0 1.8 0L19.5 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const ICON_WALLET = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 7V5a2 2 0 0 0-2-2H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H6a1 1 0 0 1 0-2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12h-5v5h5" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/><circle cx="17.5" cy="14.5" r=".75" fill="currentColor"/></svg>`;

function escapeText(value){
  return value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function syncHome(){
  if (linked === 'privy'){
    bal.textContent = '$12.40';
    hint.textContent = ADDR_PRIVY_SOL + ' · Solana + EVM';
    openBtn.style.display = 'none';
    document.getElementById('amtSol').textContent = '0.08';
    document.getElementById('amtUsdc').textContent = '4.00';
  } else if (linked === 'ext'){
    bal.textContent = '$128.50';
    hint.textContent = 'External wallet · ' + ADDR_EXT;
    openBtn.style.display = 'none';
    document.getElementById('amtSol').textContent = '0.92';
    document.getElementById('amtUsdc').textContent = '18.00';
  } else {
    bal.textContent = '$0.00';
    hint.textContent = 'Connect a wallet to trade and hold positions.';
    openBtn.style.display = state === 'home' ? '' : 'none';
    document.getElementById('amtSol').textContent = '—';
    document.getElementById('amtUsdc').textContent = '—';
  }
}

function manageTarget(){
  if (linked === 'privy') return 'ok_privy';
  if (linked === 'ext') return 'ok_ext';
  return 'connect';
}

function render(s, push){
  stopOtpTimer();
  sheet.dataset.state = s;
  if (s === 'home'){
    state = 'home'; sheet.classList.remove('on'); scrim.classList.remove('on');
    syncHome(); syncDock(); return;
  }
  if (push && state !== 'home' && state !== s) stack.push(state);
  if (state === 'home') stack = [];
  state = s;
  sheet.classList.add('on'); scrim.classList.add('on');
  openBtn.style.display = 'none';
  const c = copy[s] || { title:'Connect', sub:'' };
  title.textContent = c.title;
  sub.textContent = s === 'otp' ? 'Sent to ' + emailIdentity : c.sub;
  sub.style.display = c.sub ? '' : 'none';
  const canBack = ['otp','export'].includes(s);
  backBtn.classList.toggle('show', canBack);
  body.innerHTML = '';
  const el = document.createElement('div');

  if (s === 'connect'){
    el.innerHTML = `
      <form class="connect-form" id="emailForm" novalidate>
        <label for="emailInput">Email</label>
        <div class="email-field">
          ${ICON_EMAIL}
          <input id="emailInput" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" enterkeyhint="go" required placeholder="you@example.com" value="${escapeText(emailDraft)}" aria-describedby="emailError">
        </div>
        <p class="email-error" id="emailError" aria-live="polite" hidden></p>
        <button class="cta" type="submit">Continue</button>
      </form>
      <button class="external-entry" type="button" data-go="wait_ext">
        ${ICON_WALLET}<span>Connect external wallet</span>
      </button>`;
  } else if (s === 'otp'){
    prepareOtp(emailIdentity);
    el.innerHTML = `
      <p class="otp-feedback" id="otpStatus" role="status" aria-live="polite" aria-atomic="true"></p>
      <form id="otpForm" novalidate>
        <div class="otp" id="otpBoxes"><input id="otpInput" aria-label="Six-digit code" aria-describedby="otpError" type="text" inputmode="numeric" autocomplete="one-time-code" enterkeyhint="go" required pattern="[0-9]{6}" maxlength="6" placeholder="000000" value="${escapeText(otpCode)}"></div>
        <div class="otp-tools">
          <button class="otp-paste" type="button" data-act="otp-paste">Paste</button>
          <button class="otp-resend" id="otpResend" type="button" data-act="otp-resend">Resend code</button>
        </div>
        <p class="otp-error" id="otpError" aria-live="polite" hidden></p>
        <button class="cta" type="submit">Verify</button>
      </form>`;
  } else if (s === 'wait_setup'){
    el.className = 'wait';
    el.innerHTML = `<div class="spin"></div><h3>Setting up your wallet</h3><p>This only takes a moment.</p>`;
    setTimeout(()=>{ if(state==='wait_setup'){ linked='privy'; setupFails=0; go('ok_privy', true); } }, 900);
  } else if (s === 'wait_ext'){
    el.className = 'wait';
    el.innerHTML = `<div class="spin"></div><h3>Approve in your wallet</h3><p>Demo connection in progress.</p>`;
    setTimeout(()=>{ if(state==='wait_ext'){ linked='ext'; setupFails=0; go('ok_ext', true); } }, 900);
  } else if (s === 'fail_login'){
    el.className = 'fail';
    el.innerHTML = `
      <div class="icon">!</div>
      <h3>Sign-in failed</h3>
      <p>Couldn’t verify your email.</p>
      <button class="cta" type="button" data-go="connect">Try again</button>`;
  } else if (s === 'fail_setup'){
    el.className = 'fail';
    const showLogout = setupFails >= 3;
    el.innerHTML = `
      <div class="icon">!</div>
      <h3>Wallet setup failed</h3>
      <p>You’re signed in, but the wallet didn’t finish connecting.</p>
      <button class="cta" type="button" data-act="retry-setup">Try wallet again</button>
      ${showLogout ? '<button class="logout" type="button" data-act="logout">Log out and start over</button>' : ''}`;
  } else if (s === 'ok_privy'){
    linked = 'privy';
    confirmFrom = 'ok_privy';
    syncHome();
    const mark = `<span class="mark em">${ICON_EMAIL}</span>`;
    el.className = 'ok';
    el.innerHTML = `
      <div class="ident">
        ${mark}
        <div class="who"><b>${escapeText(emailIdentity)}</b><span>Email</span></div>
      </div>
      <div class="chain">
        <div class="labrow"><span class="lab">Solana</span><button type="button" data-act="copy-privy-sol">Copy</button></div>
        <div class="addr"><span class="str">${ADDR_PRIVY_SOL}</span></div>
      </div>
      <div class="chain">
        <div class="labrow"><span class="lab">EVM</span><button type="button" data-act="copy-privy-evm">Copy</button></div>
        <div class="addr"><span class="str">${ADDR_PRIVY_EVM}</span></div>
      </div>
      <div class="actions">
        <button class="cta ghost" type="button" data-go="export">Export / recovery</button>
        <button class="cta danger" type="button" data-go="confirm">Disconnect</button>
      </div>`;
  } else if (s === 'ok_ext'){
    linked = 'ext';
    confirmFrom = 'ok_ext';
    syncHome();
    const mark = `<span class="mark">${ICON_WALLET}</span>`;
    el.className = 'ok';
    el.innerHTML = `
      <div class="ident">
        ${mark}
        <div class="who"><b>External wallet</b><span>Solana</span></div>
      </div>
      <div class="chain">
        <div class="labrow"><span class="lab">Solana</span><button type="button" data-act="copy-ext">Copy</button></div>
        <div class="addr"><span class="str">${ADDR_EXT}</span></div>
      </div>
      <div class="actions">
        <button class="cta danger" type="button" data-go="confirm">Disconnect</button>
      </div>`;
  } else if (s === 'export'){
    if (linked !== 'privy'){ go(linked === 'ext' ? 'ok_ext' : 'connect'); return; }
    el.className = 'export-options';
    el.innerHTML = `
      <ol class="export-steps">
        <li>Sign in to Privy with your <strong>MyBoon email</strong>.</li>
        <li>Open <strong>My Apps</strong> → <strong>MyBoon</strong>.</li>
        <li>Choose your wallet and follow the export instructions.</li>
      </ol>
      <p class="key-warning">Keep your private key to yourself.</p>
      <div class="export-actions">
      <button class="btn-primary" type="button" data-go="export_wait">Continue with Privy</button>
      <button class="btn-secondary" type="button" data-go="ok_privy">Not now</button>
      </div>`;
  } else if (s === 'export_wait'){
    if (linked !== 'privy'){ go(linked === 'ext' ? 'ok_ext' : 'connect'); return; }
    el.className = 'wait';
    el.innerHTML = `<div class="spin"></div><h3>Simulating Privy handoff</h3><p>No wallet service is opened.</p>`;
    setTimeout(()=>{ if(state==='export_wait') go('export_done', true); }, 1000);
  } else if (s === 'export_done'){
    if (linked !== 'privy'){ go(linked === 'ext' ? 'ok_ext' : 'connect'); return; }
    el.className = 'fail';
    el.style.paddingTop = '20px';
    el.innerHTML = `
      <div class="icon" style="background:#0a3d34;color:var(--vir)">✓</div>
      <h3>Demo complete</h3>
      <p>No keys were exported.</p>
      <button class="cta" type="button" data-go="ok_privy">Back to wallet</button>`;
  } else if (s === 'confirm'){
    el.className = 'fail';
    el.innerHTML = `
      <h3 style="margin-top:12px">Disconnect this wallet?</h3>
      <p>You’ll need to connect again to trade.</p>
      <button class="cta danger" type="button" data-act="do-disconnect">Disconnect</button>
      <button class="cta ghost" type="button" style="margin-top:8px" data-act="cancel-disconnect">Cancel</button>`;
  }
  body.appendChild(el);
  if (s === 'otp') watchOtp();
  syncDock();
}

function go(s, fromAuto){
  if (s === 'home'){ stack=[]; render('home'); return; }
  if (fromAuto){ stack=[]; }
  render(s, !fromAuto);
}

function syncDock(){
  document.querySelectorAll('#dock button').forEach(b=>{
    b.classList.toggle('on', b.dataset.go === state);
  });
}

document.getElementById('dock').innerHTML = STATES.map(([id,label])=>
  `<button type="button" data-go="${id}">${label}</button>`
).join('');

document.body.addEventListener('input', (e)=>{
  if (e.target.id === 'otpInput'){
    otpCode = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
    e.target.value = otpCode;
    e.target.removeAttribute('aria-invalid');
    document.getElementById('otpError').hidden = true;
    return;
  }
  if (e.target.id !== 'emailInput') return;
  emailDraft = e.target.value;
  e.target.removeAttribute('aria-invalid');
  const error = document.getElementById('emailError');
  error.hidden = true; error.textContent = '';
});

document.body.addEventListener('submit', (e)=>{
  if (e.target.id === 'otpForm'){
    e.preventDefault();
    const input = document.getElementById('otpInput');
    if (!input.checkValidity()){
      const error = document.getElementById('otpError');
      error.textContent = 'Enter the six-digit code.'; error.hidden = false;
      input.setAttribute('aria-invalid', 'true'); input.focus();
      return;
    }
    otpCode = input.value; go('wait_setup'); return;
  }
  if (e.target.id !== 'emailForm') return;
  e.preventDefault();
  const input = document.getElementById('emailInput');
  input.value = input.value.trim();
  emailDraft = input.value;
  if (!input.checkValidity()){
    const error = document.getElementById('emailError');
    error.textContent = 'Enter a valid email address.';
    error.hidden = false;
    input.setAttribute('aria-invalid', 'true'); input.focus();
    return;
  }
  emailIdentity = emailDraft; go('otp');
});

document.body.addEventListener('click', (e)=>{
  const act = e.target.closest('[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a === 'otp-paste'){
      const input = document.getElementById('otpInput');
      if (input){ input.value = '482193'; input.dispatchEvent(new Event('input', { bubbles:true })); }
      return;
    }
    if (a === 'otp-resend'){
      if (state !== 'otp' || otpSendingUntil || Date.now() < otpResendAt) return;
      beginDemoSend(true); watchOtp(); return;
    }
    if (a === 'retry-setup'){ setupFails = 0; go('wait_setup'); return; }
    if (a === 'logout'){ linked=null; setupFails=0; stack=[]; go('connect'); return; }
    if (a === 'do-disconnect'){ linked=null; setupFails=0; go('home'); return; }
    if (a === 'cancel-disconnect'){ go(confirmFrom); return; }
    if (a === 'copy-privy-sol' || a === 'copy-privy-evm' || a === 'copy-ext'){
      act.textContent = 'Copied';
      setTimeout(()=>{ if(act.isConnected) act.textContent = 'Copy'; }, 900);
      return;
    }
  }
  const t = e.target.closest('[data-go]');
  if (!t) return;
  const s = t.dataset.go;
  if (t.closest('#dock')){
    stack = [];
    if (s === 'ok_privy' || s === 'export' || s === 'export_wait' || s === 'export_done'){
      linked = 'privy';
      confirmFrom = 'ok_privy';
    } else if (s === 'ok_ext'){
      linked = 'ext';
      confirmFrom = 'ok_ext';
    } else if (s === 'confirm'){
      if (!linked) linked = 'privy';
      confirmFrom = linked === 'ext' ? 'ok_ext' : 'ok_privy';
    } else if (['connect','otp','wait_setup','wait_ext','fail_login','fail_setup','home'].includes(s)){
      linked = null;
    }
    if (s === 'fail_setup'){ setupFails = 3; }
    syncHome();
    go(s); return;
  }
  go(s);
});

manageBtn.addEventListener('click', ()=> go(manageTarget()));
openBtn.addEventListener('click', ()=> go('connect'));
backBtn.addEventListener('click', ()=>{
  if (state === 'otp'){ stack=[]; render('connect', false); return; }
  const prev = stack.pop() || (linked === 'privy' ? 'ok_privy' : 'connect');
  render(prev, false);
});
document.getElementById('closeBtn').addEventListener('click', ()=> go('home'));
scrim.addEventListener('click', ()=> go('home'));

window.addEventListener('pagehide', stopOtpTimer);
window.addEventListener('pageshow', ()=>{ if (state === 'otp') watchOtp(); });

go('connect');
if(document.documentElement.classList.contains('mb-embed')&&window.parent!==window){
 const embedNotes=document.createElement('script');
 embedNotes.src='../proto-notes.js';
 document.body.appendChild(embedNotes);
}
</script>
</body>
</html>
