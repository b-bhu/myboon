<!doctype html>
<!-- MyBoon internal Atlas dashboard (#555). View-only mock. ALL ROWS ARE SAMPLE DATA. Columns match packages/api/src/internal/atlas-browse.ts (#552). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Atlas · MyBoon internal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#031F2C;--card:#063343;--surf:#073B4C;--lift:#0A4A60;--edge:#185A70;--bone:#F5FAFC;--dim:#9CB8C2;--faint:#6B95A1;--green:#06D6A0;--gold:#FFD166;--red:#EF476F;--blue:#118AB2;
--head:"Space Grotesk",system-ui,sans-serif;--body:Inter,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--bone);font:13px/1.45 var(--body);overflow-x:clip}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}
.mono{font-family:var(--mono)}.dim{color:var(--dim)}.faint{color:var(--faint)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--edge)}
.bar{display:flex;align-items:center;gap:16px;height:52px;padding:0 20px}
.bar h1{font:600 16px var(--head);letter-spacing:-.2px}.bar h1 span{color:var(--faint);font-weight:500}
.bar .sp{flex:1}.bar .who{font-size:12px;color:var(--dim)}.bar .out{font-size:12px;color:var(--dim);height:30px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge)}
.tabs{display:flex;gap:4px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs button{height:40px;padding:0 12px;font:500 13px var(--head);color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--bone);border-color:var(--gold)}.tabs .n{font:11px var(--mono);color:var(--faint);margin-left:6px}
main{padding:16px 20px 40px;max-width:1600px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.f{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;background:var(--card);box-shadow:inset 0 0 0 1px var(--edge);font-size:12px}
.f label{color:var(--faint);font:11px var(--mono)}.f select,.f input{background:none;border:0;outline:none;font-size:12px}.f select option{background:var(--card)}
.f input{width:180px}.seg{display:flex;padding:2px;gap:2px;background:var(--card);border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge)}
.seg button{height:28px;padding:0 10px;border-radius:4px;font:12px var(--mono);color:var(--dim)}.seg button.on{background:var(--lift);color:var(--bone)}
.clear{font-size:12px;color:var(--gold);padding:0 6px}.count{margin-left:auto;font:11px var(--mono);color:var(--faint)}
.fbtn{display:none}
.tw{background:var(--card);border-radius:8px;box-shadow:inset 0 0 0 1px var(--edge);overflow:hidden}
table{width:100%;border-collapse:collapse}th{text-align:left;font:500 11px var(--mono);color:var(--faint);padding:9px 10px;background:var(--surf);border-bottom:1px solid var(--edge);white-space:nowrap;z-index:1}
td{padding:8px 10px;border-bottom:1px solid #185A7080;vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:#0A4A6055}tr.sel td{background:#0A4A60}
.id{font:12px var(--mono);color:var(--dim);white-space:nowrap}.t{font:12px var(--mono);white-space:nowrap;color:var(--dim)}
.txt{max-width:460px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;font:11px var(--mono);box-shadow:inset 0 0 0 1px var(--edge);color:var(--dim);white-space:nowrap}
.chip.g{color:var(--green);box-shadow:inset 0 0 0 1px #06D6A066}.chip.r{color:var(--red);box-shadow:inset 0 0 0 1px #EF476F66}.chip.y{color:var(--bone);box-shadow:inset 0 0 0 1px #FFD16666}.chip.b{color:#7FC8E3;box-shadow:inset 0 0 0 1px #118AB288}
a.lk{color:var(--bone);text-decoration:underline;text-decoration-color:var(--edge);text-underline-offset:3px;cursor:pointer}a.lk:hover{text-decoration-color:var(--gold)}
.more{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px}.more button{height:36px;padding:0 18px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge);font-weight:500}
.state{padding:48px 20px;text-align:center;color:var(--dim)}.state b{display:block;color:var(--bone);font:600 15px var(--head);margin-bottom:4px}
.state .retry{margin-top:12px;height:32px;padding:0 14px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge);color:var(--bone)}
.sk td div{height:12px;border-radius:3px;background:var(--surf)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;box-shadow:inset 0 0 0 1px #EF476F66;background:#EF476F14;margin-bottom:12px;font-size:12px}
/* detail panel */
.scrim{position:fixed;inset:0;background:#031F2CB3;z-index:20;display:none}.scrim.on{display:block}
.detail{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100%;background:var(--bg);border-left:1px solid var(--edge);z-index:21;overflow-y:auto;transform:translateX(100%);transition:transform .2s}
.detail.on{transform:none}
.dh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--edge);z-index:2}
.dh b{font:600 15px var(--head)}.dh .x{margin-left:auto;width:32px;height:32px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge);font-size:16px;color:var(--dim)}
.dh .bk{display:none}
.db{padding:16px}.sec{margin-bottom:20px}.sec h3{font:500 11px var(--mono);color:var(--faint);letter-spacing:.6px;margin-bottom:8px;display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:8px;box-shadow:inset 0 0 0 1px var(--edge);padding:12px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12px}.kv dt{color:var(--faint);font-family:var(--mono);font-size:11px}.kv dd{min-width:0;overflow-wrap:anywhere}
.quote{font-size:14px;line-height:1.5;margin-bottom:10px}
.item{padding:10px 0;border-bottom:1px solid #185A7080}.item:last-child{border:0}.item b{display:block;font-weight:600}.item .m{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
/* filter sheet (phone) */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surf);border-radius:14px 14px 0 0;border-top:1px solid var(--edge);padding:8px 16px 20px;transform:translateY(100%);transition:transform .2s;max-height:85vh;overflow-y:auto}
.sheet.on{transform:none}.grab{width:36px;height:4px;border-radius:2px;background:var(--edge);margin:4px auto 12px}
.sheet h3{font:600 16px var(--head);margin-bottom:12px}.sheet .fg{margin-bottom:14px}.sheet .fg>label{display:block;font:11px var(--mono);color:var(--faint);margin-bottom:6px}
.sheet .opts{display:flex;flex-wrap:wrap;gap:6px}.sheet .opts button{height:32px;padding:0 12px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge);font-size:13px;color:var(--dim)}.sheet .opts button.on{color:var(--bone);box-shadow:inset 0 0 0 1.5px var(--gold)}
.sheet input{width:100%;height:40px;border-radius:6px;background:var(--card);border:0;box-shadow:inset 0 0 0 1px var(--edge);padding:0 12px;outline:none}
.sheet .act{display:flex;gap:8px;margin-top:8px}.sheet .act button{flex:1;height:44px;border-radius:8px;font-weight:600}.sheet .apply{background:var(--bone);color:var(--bg)}.sheet .reset{box-shadow:inset 0 0 0 1px var(--edge)}
.sscrim{position:fixed;inset:0;background:#031F2CB3;z-index:30;display:none}.sscrim.on{display:block}
.mockbar{position:fixed;left:12px;bottom:12px;z-index:40;display:flex;gap:4px;padding:3px;background:var(--surf);border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge);font:10px var(--mono)}
.mockbar span{color:var(--faint);padding:4px 6px}.mockbar button{padding:4px 7px;border-radius:4px;color:var(--dim)}.mockbar button.on{background:var(--lift);color:var(--bone)}
/* phone */
@media (max-width:720px){
 .bar{padding:0 14px}.bar .who{display:none}.tabs{padding:0 8px}main{padding:12px 12px 80px}
 .filters .f,.filters .seg,.filters .clear{display:none}.fbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge);font-size:13px}
 .fbtn i{font-style:normal;font:11px var(--mono);color:var(--bg);background:var(--bone);border-radius:9px;padding:0 6px}
 .active{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
 table,thead,tbody,tr,td{display:block}thead{display:none}
 tr.r{padding:10px 12px;border-bottom:1px solid #185A7080;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
 tr.r td{padding:0;border:0;background:none!important}td[data-m=hide]{display:none}
 td[data-m=top]{order:-2;flex:1 1 calc(100% - 64px);font-weight:500;font-size:14px}td[data-m=meta]{order:0}
 td[data-m=right]{order:-1;margin-left:auto}
 .txt{max-width:none}.detail{width:100%;border:0}.dh .x{display:none}.dh .bk{display:grid;place-items:center;width:32px;height:32px;font-size:18px;color:var(--bone)}
 .kv{grid-template-columns:104px 1fr}.mockbar{display:none}
}
@media (min-width:721px){.active{display:none}}
</style></head><body>
<header><div class="bar"><h1>Atlas <span>· internal</span></h1><div class="sp"></div><span class="who mono">signed in · internal session</span><button class="out">Sign out</button></div>
<nav class="tabs" id="tabs"></nav></header>
<main><div class="filters" id="filters"></div><div id="body"></div></main>
<div class="scrim" id="scrim"></div><aside class="detail" id="detail" aria-label="Signal detail"></aside>
<div class="sscrim" id="sscrim"></div><div class="sheet" id="sheet"></div>
<div class="mockbar" id="mockbar"></div>
<script>
// ---------- SAMPLE DATA (fake, shaped like /internal/atlas/* responses) ----------
const NOW=Date.parse('2026-11-01T14:30:00Z');const ago=m=>new Date(NOW-m*60000).toISOString();
const ENT=[["solana","Solana","asset"],["jupiter","Jupiter","protocol"],["federal-reserve","Federal Reserve","organization"],["bitcoin","Bitcoin","asset"],["us-iran-talks","US–Iran talks","topic"],["meteora","Meteora","protocol"],["sec","SEC","regulation"],["pacifica","Pacifica","protocol"],["circle","Circle","organization"],["jerome-powell","Jerome Powell","person"],["polymarket","Polymarket","product"],["fomc-dec-2026","FOMC Dec 2026","event"]];
const SRC=['x','x','x','rss','birdeye','jupiter','x','rss'],TYP={x:'post',rss:'news',birdeye:'onchain_event',jupiter:'price_move'};
const TXT=["Jupiter volume up 40% after perps v2 launch; fees hit a weekly high","SOL clears $180 as spot ETF inflows reach a weekly record","Fed's Powell: 'no rush' on December cut, market odds slip to 54%","Oman to host second round of US–Iran talks next week, per Reuters","Meteora DLMM pools pass $1B TVL for the first time","SEC delays decision on Solana ETF filings to January","Whale moved 2.1M USDC from Pacifica to Phoenix","Circle mints 500M USDC on Solana in a single hour","Polymarket: 'Fed cuts in Dec' falls from 68% to 54%","BTC funding flips negative on major perps venues","New memecoin launches on Raydium hit 9k in a day","Kamino adds JitoSOL looping with a 4x cap"];
const SIGNALS=[],DECS=[],ITEMS=[];
const stat=['analysed','analysed','written','received','parked','analysed','written','dead'];
for(let i=0;i<34;i++){const s=SRC[i%SRC.length];const sid='sig_'+(0x9f3a10-i*37).toString(16);const st=stat[i%stat.length];const tx=TXT[i%TXT.length];
 SIGNALS.push({signal_id:sid,source:s,source_id:s==='x'?'18'+(5523110+i*911):s+'-'+(4410+i),type:TYP[s],status:st,priority:[1,2,3,2,1][i%5],occurred_at:ago(i*23+4),fetched_at:ago(i*23+3),created_at:ago(i*23+2),text:tx,excerpt:tx.slice(0,80),link:'https://x.com/i/status/18'+(5523110+i*911),unusual_score:+((0.92-i*0.021)%1).toFixed(2),parked_reason:st==='parked'?'duplicate_of_recent':null,attempts:st==='dead'?3:1});
 if(st!=='received'&&st!=='dead'&&st!=='parked'||i%9===0){const dec=['keep','keep','ignore','keep','unclear','ignore'][i%6];const e1=ENT[i%ENT.length],e2=ENT[(i+3)%ENT.length];
  DECS.push({id:'dec_'+(0x51c200-i*19).toString(16),signal_id:sid,decision:dec,action:dec==='keep'?'keep':'skip',reason:dec==='keep'?'Material move tied to a tracked entity':dec==='ignore'?(i%2?'Duplicate of an earlier signal':'Low signal: opinion without new facts'):'Source unclear; needs a second report',summary:dec==='keep'?tx:'',targets:dec==='keep'?[{entity:e1[0],type:e1[2],angle:['existing_story','new_story','plain_update'][i%3]},...(i%2?[{entity:e2[0],type:e2[2],angle:'plain_update'}]:[])]:[],confidence:+(0.94-(i%7)*0.06).toFixed(2),model_name:'glm-5.3-flash',analyst_version:'v4.2',outcome:dec==='keep'?'written':'closed',entity_outcome:i%5===0?'new':null,created_at:ago(i*23+1)});
  if(dec==='keep'){[e1,...(i%2?[e2]:[])].forEach((e,k)=>ITEMS.push({id:'itm_'+(0x7a0e00-i*13-k).toString(16),title:k?e[1]+': '+tx.split(';')[0].slice(0,48):tx,note:k?'Mentioned as a related move':'Primary entity for this signal',angle:['existing_story','new_story','plain_update'][(i+k)%3],signal_id:sid,occurred_at:ago(i*23+4),created_at:ago(i*23),status:i%11===0&&k?'merged':'active',main_entity_id:'ent_'+e[0],entity_slug:e[0],entity_name:e[1]}))}}}
const ENTITIES=ENT.map((e,i)=>({id:'ent_'+(0x3b00+i*7).toString(16),slug:e[0],name:e[1],type:e[2],aliases:{solana:['SOL'],jupiter:['JUP','Jup'],'federal-reserve':['Fed','FOMC'],bitcoin:['BTC'],'jerome-powell':['Powell']}[e[0]]||[],summary:'Sample summary for '+e[1]+'.',status:i===11?'proposed':i===8?'retired':'active',show_in_carousel:i<5,created_at:ago(60*24*(40-i)),updated_at:ago(i*47+9),entity_reviewed_at:i%3?ago(i*90+30):null}));
// ---------- STATE ----------
const Q=new URLSearchParams(location.search);
const S={tab:Q.get('tab')||'signals',shown:Q.get('shown')?+Q.get('shown'):10,mock:Q.get('state')||'live',f:{since:'24h'},detail:Q.get('detail'),sheet:Q.has('sheet')};
if(Q.get('f'))Object.assign(S.f,JSON.parse(Q.get('f')));
const TABS={signals:['Signals',SIGNALS,'GET /internal/atlas/signals'],analyst:['Analyst decisions',DECS,'GET /internal/atlas/analyst'],entities:['Entities',ENTITIES,'GET /internal/atlas/entities'],items:['Entity items',ITEMS,'GET /internal/atlas/entity-items']};
const FIL={signals:[['since','time'],['source','sel',['x','rss','birdeye','jupiter']],['q','text','Search text (7d max)']],
 analyst:[['since','time'],['decision','seg',['keep','ignore','unclear']],['entity','text','entity slug'],['signal_id','text','signal_id']],
 entities:[['since','time'],['type','sel',['organization','asset','protocol','person','topic','place','event','product','regulation']],['status','sel',['active','proposed','retired']],['carousel','seg',['true','false']],['q','text','name, slug or alias']],
 items:[['since','time'],['angle','seg',['new_story','existing_story','plain_update']],['entity','text','entity slug'],['signal_id','text','signal_id']]};
const WIN=['1h','24h','7d','30d'];const winMin={'1h':60,'24h':1440,'7d':10080,'30d':43200};
const rel=iso=>{const m=Math.round((NOW-Date.parse(iso))/60000);return m<60?m+'m':m<1440?Math.floor(m/60)+'h '+(m%60)+'m':Math.floor(m/1440)+'d'};
const hhmm=iso=>iso.slice(5,10)+' '+iso.slice(11,16);
const chip=(v,c)=>`<span class="chip ${c||''}">${v}</span>`;
const DC={keep:'g',ignore:'r',unclear:'y'},SC={analysed:'b',written:'g',parked:'y',dead:'r',received:''};
function rows(){const [,all]=TABS[S.tab];const f=S.f;return all.filter(r=>{
 const tcol=S.tab==='entities'?'updated_at':'created_at';if(f.since&&(NOW-Date.parse(r[tcol]))/60000>winMin[f.since])return false;
 if(f.source&&r.source!==f.source)return false;if(f.decision&&r.decision!==f.decision)return false;if(f.type&&r.type!==f.type)return false;
 if(f.status&&r.status!==f.status)return false;if(f.carousel&&String(r.show_in_carousel)!==f.carousel)return false;if(f.angle&&r.angle!==f.angle)return false;
 if(f.signal_id&&r.signal_id!==f.signal_id)return false;
 if(f.entity){if(S.tab==='analyst'&&!r.targets.some(t=>t.entity===f.entity))return false;if(S.tab==='items'&&r.entity_slug!==f.entity)return false}
 if(f.q){const q=f.q.toLowerCase();if(!JSON.stringify(r).toLowerCase().includes(q))return false}return true})}
const COLS={
 signals:[['created_at',r=>`<span class="t" title="${r.created_at}">${hhmm(r.created_at)}</span>`,'meta'],['signal_id',r=>`<span class="id">${r.signal_id}</span>`,'hide'],['source',r=>chip(r.source),'meta'],['type',r=>`<span class="dim">${r.type}</span>`,'meta'],['status',r=>chip(r.status,SC[r.status])+(r.parked_reason?` <span class="faint mono" style="font-size:11px">${r.parked_reason}</span>`:''),'meta'],['text',r=>`<div class="txt">${r.text}</div>`,'top'],['unusual_score',r=>`<span class="num">${r.unusual_score.toFixed(2)}</span>`,'right'],['priority',r=>`<span class="num">${r.priority}</span>`,'hide'],['attempts',r=>`<span class="num">${r.attempts}</span>`,'hide']],
 analyst:[['created_at',r=>`<span class="t">${hhmm(r.created_at)}</span>`,'meta'],['decision',r=>chip(r.decision,DC[r.decision]),'right'],['reason',r=>`<div class="txt">${r.reason}</div>`,'top'],['targets',r=>r.targets.map(t=>`<a class="lk mono" data-ent="${t.entity}" style="font-size:12px">${t.entity}</a>`).join(', ')||'<span class="faint">—</span>','meta'],['confidence',r=>`<span class="num">${r.confidence.toFixed(2)}</span>`,'meta'],['signal_id',r=>`<a class="lk id" data-sig="${r.signal_id}">${r.signal_id}</a>`,'meta'],['model_name',r=>`<span class="faint mono" style="font-size:11px">${r.model_name} · ${r.analyst_version}</span>`,'hide'],['entity_outcome',r=>r.entity_outcome?chip(r.entity_outcome):'<span class="faint">—</span>','hide']],
 entities:[['updated_at',r=>`<span class="t">${hhmm(r.updated_at)}</span>`,'meta'],['name',r=>`<b style="font-weight:600">${r.name}</b> <span class="id">${r.slug}</span>`,'top'],['type',r=>chip(r.type),'meta'],['status',r=>chip(r.status,r.status==='active'?'g':r.status==='retired'?'r':'y'),'right'],['aliases',r=>`<span class="dim mono" style="font-size:12px">${r.aliases.join(', ')||'—'}</span>`,'hide'],['show_in_carousel',r=>r.show_in_carousel?chip('carousel','b'):'<span class="faint">—</span>','meta'],['entity_reviewed_at',r=>r.entity_reviewed_at?`<span class="t">${hhmm(r.entity_reviewed_at)}</span>`:'<span class="faint">never</span>','hide'],['items',r=>`<a class="lk" data-ent="${r.slug}" style="font-size:12px">Items →</a>`,'meta']],
 items:[['created_at',r=>`<span class="t">${hhmm(r.created_at)}</span>`,'meta'],['title',r=>`<div class="txt">${r.title}</div>`,'top'],['entity',r=>`<a class="lk" data-ent="${r.entity_slug}">${r.entity_name}</a>`,'meta'],['angle',r=>chip(r.angle),'meta'],['status',r=>chip(r.status,r.status==='merged'?'y':''),'right'],['signal_id',r=>`<a class="lk id" data-sig="${r.signal_id}">${r.signal_id}</a>`,'meta'],['note',r=>`<span class="dim">${r.note}</span>`,'hide']]};
// ---------- RENDER ----------
function render(){
 document.getElementById('tabs').innerHTML=Object.entries(TABS).map(([k,[n,all]])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${n}<span class="n">${all.length>=30?'30+':all.length}</span></button>`).join('');
 const act=Object.entries(S.f).filter(([k,v])=>v);
 document.getElementById('filters').innerHTML=FIL[S.tab].map(([k,t,o])=>t==='time'?`<div class="seg" title="since">${WIN.map(w=>`<button data-set="since:${w}" class="${S.f.since===w?'on':''}">${w}</button>`).join('')}</div>`:
  t==='seg'?`<div class="f"><label>${k}</label></div><div class="seg">${['all',...o].map(w=>`<button data-set="${k}:${w==='all'?'':w}" class="${(S.f[k]||'')===(w==='all'?'':w)?'on':''}">${w}</button>`).join('')}</div>`:
  t==='sel'?`<div class="f"><label>${k}</label><select data-sel="${k}"><option value="">all</option>${o.map(w=>`<option ${S.f[k]===w?'selected':''}>${w}</option>`).join('')}</select></div>`:
  `<div class="f"><label>${k}</label><input data-in="${k}" placeholder="${o}" value="${S.f[k]||''}"></div>`).join('')+
  (act.length>1||(act.length&&act[0][0]!=='since')?`<button class="clear" data-clear>Clear filters</button>`:'')+
  `<button class="fbtn" data-sheet>Filters <i>${act.length}</i></button><div class="active">${act.map(([k,v])=>chip(k+': '+v)).join('')}</div><span class="count" id="count"></span>`;
 const body=document.getElementById('body');const cols=COLS[S.tab];
 if(S.mock==='loading'){body.innerHTML=`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${Array.from({length:8},()=>`<tr class="sk">${cols.map(()=>'<td><div style="width:'+(40+Math.random()*50)+'%"></div></td>').join('')}</tr>`).join('')}</tbody></table></div>`;count('loading…');return}
 if(S.mock==='error'){body.innerHTML=`<div class="tw"><div class="state"><b>Couldn’t load ${TABS[S.tab][0].toLowerCase()}</b>The API returned 502 (upstream read failed). Your filters are kept.<br><button class="retry" data-retry>Retry</button></div></div>`;count('');return}
 const all=S.mock==='empty'?[]:rows();const show=all.slice(0,S.shown);
 if(!all.length){body.innerHTML=`<div class="tw"><div class="state"><b>No ${TABS[S.tab][0].toLowerCase()} match</b>Nothing in the last ${S.f.since||'window'} with these filters.<br><button class="retry" data-clear>Clear filters</button></div></div>`;count('0 rows');return}
 body.innerHTML=(S.mock==='moreerr'?`<div class="banner"><span>Couldn’t load more. The rows above are kept.</span><button class="clear" data-retry>Retry</button></div>`:'')+`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${show.map(r=>`<tr class="r ${S.detail&&(r.signal_id===S.detail)&&S.tab==='signals'?'sel':''}" data-row="${r.signal_id||''}" data-slug="${r.slug||''}">${cols.map(c=>`<td data-m="${c[2]}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>
 <div class="more">${show.length<all.length?`<button data-more>Load more</button><span class="faint mono" style="font-size:11px">${show.length} shown · next cursor</span>`:`<span class="faint mono" style="font-size:11px">End · ${show.length} rows</span>`}</div></div>`;
 count(`${show.length} rows · ${TABS[S.tab][2]}`);
}
function count(t){const c=document.getElementById('count');if(c)c.textContent=t}
function openDetail(sid){S.detail=sid;const s=SIGNALS.find(x=>x.signal_id===sid);if(!s)return;const d=DECS.filter(x=>x.signal_id===sid),it=ITEMS.filter(x=>x.signal_id===sid);
 document.getElementById('detail').innerHTML=`<div class="dh"><button class="bk" data-close aria-label="Back">‹</button><b>Signal</b><span class="id">${s.signal_id}</span><button class="x" data-close aria-label="Close">×</button></div><div class="db">
 <div class="sec"><div class="card"><p class="quote">${s.text}</p><dl class="kv"><dt>source</dt><dd>${chip(s.source)} <span class="id">${s.source_id}</span></dd><dt>type</dt><dd>${s.type}</dd><dt>status</dt><dd>${chip(s.status,SC[s.status])} ${s.parked_reason||''}</dd>
 <dt>unusual_score</dt><dd class="mono">${s.unusual_score.toFixed(2)}</dd><dt>priority · attempts</dt><dd class="mono">${s.priority} · ${s.attempts}</dd><dt>occurred_at</dt><dd class="mono">${s.occurred_at.replace('T',' ').slice(0,19)}Z</dd><dt>created_at</dt><dd class="mono">${s.created_at.replace('T',' ').slice(0,19)}Z · ${rel(s.created_at)} ago</dd><dt>link</dt><dd><a class="lk mono" style="font-size:12px">${s.link.replace('https://','')}</a></dd></dl></div></div>
 <div class="sec"><h3><span>ANALYST DECISION</span><span>${d.length}</span></h3>${d.length?d.map(x=>`<div class="card"><dl class="kv"><dt>decision</dt><dd>${chip(x.decision,DC[x.decision])} <span class="mono dim" style="font-size:12px">${x.action} · conf ${x.confidence.toFixed(2)}</span></dd><dt>reason</dt><dd>${x.reason}</dd>${x.summary?`<dt>summary</dt><dd>${x.summary}</dd>`:''}<dt>targets</dt><dd>${x.targets.map(t=>`<a class="lk mono" data-ent="${t.entity}" style="font-size:12px">${t.entity}</a> <span class="faint mono" style="font-size:11px">${t.angle}</span>`).join('<br>')||'—'}</dd><dt>outcome</dt><dd class="mono">${x.outcome}${x.entity_outcome?' · entity '+x.entity_outcome:''}</dd><dt>model</dt><dd class="mono dim">${x.model_name} · ${x.analyst_version} · ${x.id}</dd></dl></div>`).join(''):`<div class="card dim">No decision yet. The signal is <b>${s.status}</b>${s.status==='received'?' and waiting in the queue':''}.</div>`}</div>
 <div class="sec"><h3><span>ENTITY ITEMS</span><span>${it.length}</span></h3><div class="card">${it.length?it.map(x=>`<div class="item"><b>${x.title}</b><div class="m"><a class="lk" data-ent="${x.entity_slug}">${x.entity_name}</a>${chip(x.angle)}${chip(x.status,x.status==='merged'?'y':'')}<span class="id">${x.id}</span></div></div>`).join(''):'<span class="dim">No entity items from this signal.</span>'}</div></div></div>`;
 document.getElementById('detail').classList.add('on');document.getElementById('scrim').classList.add('on');render()}
function closeDetail(){S.detail=null;document.getElementById('detail').classList.remove('on');document.getElementById('scrim').classList.remove('on');render()}
function openSheet(){const sh=document.getElementById('sheet');sh.innerHTML=`<div class="grab"></div><h3>Filters · ${TABS[S.tab][0]}</h3>`+FIL[S.tab].map(([k,t,o])=>`<div class="fg"><label>${k}</label>${t==='text'?`<input data-in="${k}" placeholder="${o}" value="${S.f[k]||''}">`:`<div class="opts">${(t==='time'?WIN:['all',...o]).map(w=>{const v=w==='all'?'':w;return `<button data-set="${k}:${v}" class="${(S.f[k]||'')===v?'on':''}">${w}</button>`}).join('')}</div>`}</div>`).join('')+`<div class="act"><button class="reset" data-clear>Reset</button><button class="apply" data-apply>Show results</button></div>`;
 sh.classList.add('on');document.getElementById('sscrim').classList.add('on')}
function closeSheet(){document.getElementById('sheet').classList.remove('on');document.getElementById('sscrim').classList.remove('on')}
function mockbar(){document.getElementById('mockbar').innerHTML='<span>mock state</span>'+['live','loading','empty','error','moreerr'].map(m=>`<button data-mock="${m}" class="${S.mock===m?'on':''}">${m}</button>`).join('')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-set],[data-clear],[data-more],[data-sig],[data-ent],[data-row],[data-close],[data-sheet],[data-apply],[data-mock],[data-retry],#scrim,#sscrim');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;S.f={since:'24h'};S.shown=10;closeDetail();return}
 if(t.dataset.set!==undefined){const[k,v]=t.dataset.set.split(':');S.f[k]=v;S.shown=10;render();if(t.closest('#sheet'))openSheet();return}
 if(t.dataset.clear!==undefined){S.f={since:'24h'};S.shown=10;render();if(t.closest('#sheet'))openSheet();return}
 if(t.dataset.more!==undefined){S.shown+=10;render();return}
 if(t.dataset.ent){e.stopPropagation();S.tab='items';S.f={since:'30d',entity:t.dataset.ent};S.shown=10;closeDetail();closeSheet();return}
 if(t.dataset.sig){e.stopPropagation();openDetail(t.dataset.sig);return}
 if(t.dataset.close!==undefined||t.id==='scrim'){closeDetail();return}
 if(t.dataset.sheet!==undefined){openSheet();return}
 if(t.dataset.apply!==undefined||t.id==='sscrim'){closeSheet();return}
 if(t.dataset.mock){S.mock=t.dataset.mock;mockbar();render();return}
 if(t.dataset.retry!==undefined){S.mock='live';mockbar();render();return}
 if(t.dataset.row!==undefined&&S.tab==='signals'){openDetail(t.dataset.row);return}
 if(t.dataset.slug){S.tab='items';S.f={since:'30d',entity:t.dataset.slug};S.shown=10;render()}});
document.addEventListener('change',e=>{const s=e.target.dataset.sel;if(s){S.f[s]=e.target.value;S.shown=10;render()}});
document.addEventListener('keydown',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&e.key==='Enter'){S.f[k]=e.target.value.trim();S.shown=10;render()}if(e.key==='Escape'){closeDetail();closeSheet()}});
mockbar();render();if(S.detail)openDetail(S.detail);if(S.sheet)openSheet();
</script></body></html>
